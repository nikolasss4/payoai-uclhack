[project]
name = "payoai"
version = "0.1.0"
description = "AI finance operations agent for UK small businesses, on synthetic data only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "google-genai>=2.3.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "pypdf>=5.0",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payoai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
